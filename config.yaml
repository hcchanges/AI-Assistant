life_cards:
  profile_tools_enabled: true
screen:
  enabled: true
  ocr_enabled: true
  sample_sec: 5
  scene_stable_samples: 2
  scene_cooldown_min: 10
  focus_enabled: true
  focus_minutes: 25
  read_browser_title: true
  # 社交起草的语气自适应（v2-social-tone-adaptive）：auto = 草稿顺对方当下的口吻说话；
  # off = 整层关掉，行为与加它之前逐字相同。
  tone_align: auto
  # ---- 画面情绪（CV 腿，S1~S7）----
  # 三档：off 完全不判 / local 本机离线判（默认）/ cloud 把这一帧发给多模态服务商。
  # local 会在 data/models/ 下加载中文 CLIP 的 ONNX 量化版（约 132MB，已 gitignore，
  # 仓库不带权重），想回到「一点模型都不碰」就设成 off，行为与加这层之前逐字相同。
  mood: local
  # 传屏授权：**默认关，关着的时候一个字节都不发**。只有 mood 是 cloud 且它也是 true
  # 才会真往外发；设置页「陪玩」那页切到云端档时会把要传什么、传给谁写在旁边。
  mood_cloud: false
  # 本地档判到多少分才肯报场景。0.70 是量出来的：真节庆照片 0.99，合成噪声最高 0.66。
  mood_min_score: 0.7
